services:
  mqtt-broker:
    build:
      context: ./mqtt-broker
      dockerfile: Dockerfile
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt-broker/config:/mosquitto/config
      - ./mqtt-broker/data:/mosquitto/data
      - ./mqtt-broker/log:/mosquitto/log
    restart: unless-stopped

  mqtt-replay:
    build:
      context: ./mqtt-replay
      dockerfile: Dockerfile
    depends_on:
      - mqtt-broker
    environment:
      MQTT_HOST: ${MQTT_HOST:-mqtt-broker}
      MQTT_PORT: ${MQTT_PORT:-1883}
      SPEED: ${SPEED:-1.0}
    volumes:
      - ./mqtt-replay/simple_process.csv:/app/simple_process.csv:ro
